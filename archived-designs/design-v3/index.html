<h1>Character Lens · 3 more light-mode directions</h1>
<p class="lead">Same interactive flow as v2: draw, pause for candidates, Analyze for the result sheet, try the JP model download and History. Recognition is mocked by stroke count (4: 木 水 日, 8: 学, 14: 语/語).</p>
<div class="grid">
<figure><div class="frame"><iframe src="option-1-lexicon.html" title="Option 1"></iframe></div><figcaption><b>1 · Lexicon</b><span>A printed dictionary: serif type, hairline rules, small caps, ink blue. The result reads as a dictionary entry, with no cards or shadows. <a href="option-1-lexicon.html">Open full</a></span></figcaption></figure>
<figure><div class="frame"><iframe src="option-2-signage.html" title="Option 2"></iframe></div><figcaption><b>2 · Signage</b><span>Wayfinding-sign language: flat green bar, yellow highlight, square tiles, CN/JP/KO colour codes. Made for people reading characters off real signs. <a href="option-2-signage.html">Open full</a></span></figcaption></figure>
<figure><div class="frame"><iframe src="option-3-modern.html" title="Option 3"></iframe></div><figcaption><b>3 · Modern</b><span>Bento tiles, big tight type, black and lime. Young and energetic, with chunky tap targets and a floating tab bar. <a href="option-3-modern.html">Open full</a></span></figcaption></figure>
