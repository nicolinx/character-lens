<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Character Lens · 3 Lexicon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/base.css">
<style>
:root{
  --bg:#f1f4f0; --sheet:#fbfcfa; --text:#1b2620; --muted:#66746b; --line:#d5ddd6; --green:#1d5c43; --green-d:#154733;
  --ink:#1b2620; --focus:#1d5c43; --page:#dfe4de;
  --font:'Public Sans',system-ui,sans-serif; --serif:'Source Serif 4',Georgia,serif;
}
.top{padding:20px 22px 0}
.brand{font:600 20px var(--serif);letter-spacing:-.01em}
.brand small{display:block;font:400 13px var(--font);color:var(--muted);margin-top:2px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:16px 22px 0}
.chips button{height:36px;padding:0 4px;justify-content:center;border-radius:18px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:500;color:var(--text);display:flex;gap:7px;align-items:center}
.chips button.active{background:var(--green);border-color:var(--green);color:#fff}
.pad{margin:18px 22px 0;flex:1 1 0;min-height:0;max-height:360px;background:#fff;border-radius:10px;border:1px solid var(--line);box-shadow:0 1px 0 #fff inset,0 6px 20px rgba(30,60,45,.06);
  background-image:linear-gradient(to right,#e6ece7 1px,transparent 1px),linear-gradient(to bottom,#e6ece7 1px,transparent 1px);background-size:33.333% 33.333%;background-position:-1px -1px}
.pad .hint{font:italic 400 17px var(--serif);color:var(--muted)}
.meta{display:flex;justify-content:space-between;padding:12px 22px 0;font-size:13px;color:var(--muted);align-items:center}
.meta #status{display:flex;align-items:center;gap:8px}
.meta #status::before{content:"";width:7px;height:7px;border-radius:50%;background:#b8c4bb}
.phone[data-state=drawing] #status::before{background:var(--green)}
.phone[data-state=analyzing] #status::before{background:var(--green);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.meta button{display:flex;align-items:center;gap:6px;color:var(--text);font-weight:500;font-size:13px}
.meta button:disabled{opacity:.4}
.dock{padding:14px 22px 24px;margin-top:auto}
.cta{width:100%;height:54px;border-radius:10px;background:var(--green);color:#fff;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.cta:disabled{background:#a9bdb2}
.cta:not(:disabled):active{background:var(--green-d)}

.sheet{border-radius:20px 20px 0 0;padding:10px 22px 26px;box-shadow:0 -12px 40px rgba(20,50,35,.2)}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 18px}
.tag{font:600 11px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--green)}
.entry{display:flex;align-items:center;gap:14px;margin-top:6px}
.big{font:600 64px/1.15 var(--serif)}
.pron{display:flex;align-items:center;gap:10px;font:italic 400 24px var(--serif)}
.speak{width:40px;height:40px;border-radius:50%;background:#e4eee8;color:var(--green);display:grid;place-items:center;transition:all .15s}
.speak.speaking{background:var(--green);color:#fff}
.def{margin:16px 0 0;padding:16px 0 0;border-top:1px solid var(--line);display:grid;gap:4px}
.def span{font:600 11px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.def p{margin:0;font:400 22px/1.3 var(--serif)}
.cands{display:flex;gap:8px;align-items:center;margin-top:16px;font-size:13px;color:var(--muted)}
.cand{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:#fff;font:400 20px var(--serif);color:var(--text)}
.cand.active{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green);color:var(--green)}
h3{margin:22px 0 4px;font:600 11px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
ul{list-style:none;margin:0;padding:0}
.match{display:grid;grid-template-columns:88px 54px 1fr;grid-template-areas:"lang char read" "lang char gloss";column-gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.m-lang{grid-area:lang;font:500 13px var(--font)}
.m-lang .m-code{display:none}
.m-char{grid-area:char;font:400 32px/1 var(--serif)}
.m-read{grid-area:read;font:italic 400 17px var(--serif)}
.m-gloss{grid-area:gloss;font-size:13px;color:var(--muted)}
.again{margin-top:20px;width:100%;height:48px;border-radius:10px;background:#e8eee9;font-weight:600;color:var(--green)}
</style>
</head>
<body>
<div class="phone" data-state="ready">
  <header class="top"><div class="brand">Character Lens<small>Draw it. We’ll tell you what it is.</small></div></header>

  <nav class="chips" aria-label="Language">
    <button data-lang="CN">Chinese</button>
    <button data-lang="KO">Korean</button>
    <button data-lang="AR">Arabic</button>
    <button data-lang="HI">Hindi</button>
  </nav>

  <div class="pad"><canvas id="canvas" data-width="8" aria-label="Drawing area"></canvas><p class="hint" data-bind="hint"></p></div>

  <div class="meta">
    <span id="status" role="status">Ready for input</span>
    <span style="display:flex;gap:18px">
      <button data-action="undo"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Undo</button>
      <button data-action="clear"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>Clear</button>
    </span>
  </div>

  <div class="dock"><button class="cta" data-action="analyze"><span class="spin"></span><span class="label">Analyze</span></button></div>

  <div class="scrim" data-close></div>
  <section class="sheet" role="dialog" aria-label="Result">
    <div class="grab"></div>
    <div class="tag" data-bind="tag"></div>
    <div class="entry">
      <div class="big" data-bind="char"></div>
      <div class="pron"><span><small data-bind="romanLabel" style="display:block;font:600 11px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)"></small><span data-bind="roman"></span></span>
        <button class="speak" data-action="speak" aria-label="Play pronunciation"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg></button></div>
    </div>
    <div class="def"><span>Meaning</span><p data-bind="meaning"></p></div>
    <div class="cands"><span>Not quite? Try</span><span id="cands" style="display:flex;gap:8px"></span></div>
    <h3>Related in other languages</h3>
    <ul id="matches"></ul>
    <button class="again" data-action="close">Draw another</button>
  </section>
</div>
<script src="shared/shared.js"></script>
</body>
</html>
