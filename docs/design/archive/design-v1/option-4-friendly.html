<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Character Lens · 4 Friendly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/base.css">
<style>
/* Each language owns a colour; the whole screen re-tints when you switch. */
:root{--bg:#f4f5f8;--sheet:#fff;--text:#1d2030;--muted:#737891;--line:#e6e8ef;--font:'Figtree',system-ui,sans-serif;--page:#e4e6ec;
  --accent:#e2503a;--tint:#fdeeea;--ink:#1d2030;--focus:var(--accent)}
.phone[data-lang=CN]{--accent:#e2503a;--tint:#fdeeea}
.phone[data-lang=KO]{--accent:#3366e0;--tint:#e9effc}
.phone[data-lang=AR]{--accent:#168a5c;--tint:#e3f4ec}
.phone[data-lang=HI]{--accent:#d88a0a;--tint:#fcf1da}
.top{padding:20px 20px 0;font-weight:800;font-size:20px;letter-spacing:-.02em}
.top span{color:var(--accent);transition:color .25s}
.langs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 20px 0}
.langs button{height:64px;border-radius:16px;background:#fff;border:2px solid transparent;display:grid;place-items:center;align-content:center;gap:2px;box-shadow:0 1px 2px rgba(30,35,70,.06);transition:all .2s}
.langs .g{font-size:22px;font-weight:600;line-height:1}
.langs .c{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.langs button.active{border-color:var(--accent);background:var(--tint)}
.langs button.active .c{color:var(--accent)}
.card{margin:16px 20px 0;background:#fff;border-radius:26px;padding:12px;box-shadow:0 2px 4px rgba(30,35,70,.04),0 12px 30px rgba(30,35,70,.07)}
.pad{aspect-ratio:1;border-radius:16px;background-color:#fbfbfd;
  background-image:radial-gradient(circle,#cfd3e0 1.4px,transparent 1.6px);background-size:25% 25%;background-position:0 0}
.pad::after{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
  background:linear-gradient(to right,transparent calc(50% - 1px),#e3e6ef calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px)),linear-gradient(to bottom,transparent calc(50% - 1px),#e3e6ef calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px))}
.pad canvas{z-index:1;color:var(--ink)}
.pad .hint{z-index:2;font-weight:600;color:var(--muted);font-size:15px}
.cardbar{display:flex;align-items:center;justify-content:space-between;padding:10px 6px 2px}
.cardbar #status{font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.cardbar #status::before{content:"";width:8px;height:8px;border-radius:50%;background:#c6cad8}
.phone[data-state=drawing] #status::before{background:var(--accent)}
.phone[data-state=analyzing] #status::before{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.round{width:40px;height:40px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--text)}
.round:disabled{opacity:.4}
.cta{margin:auto 20px 24px;height:60px;border-radius:30px;background:var(--accent);color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 40%,transparent);transition:background .25s,transform .1s}
.cta:disabled{background:#c9cddb;box-shadow:none}
.cta:not(:disabled):active{transform:scale(.98)}

.scrim{z-index:9}
.sheet{z-index:10;border-radius:28px 28px 0 0;padding:10px 20px 24px;box-shadow:0 -12px 40px rgba(20,25,60,.18)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px}
.hero{display:flex;gap:16px;align-items:center}
.big{width:112px;height:112px;border-radius:26px;background:var(--tint);color:var(--accent);display:grid;place-items:center;font-size:58px;font-weight:600;line-height:1;white-space:nowrap;overflow:hidden}
.hero .info{flex:1;min-width:0}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--tint);padding:5px 10px;border-radius:12px}
.roman{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:8px;line-height:1.1}
.speak{width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;transition:transform .15s}
.speak.speaking{transform:scale(1.12)}
.details{margin-top:18px;background:var(--bg);border-radius:18px;padding:4px 16px;display:grid}
.details div{padding:12px 0;display:grid;grid-template-columns:104px 1fr;align-items:baseline}
.details div+div{border-top:1px solid var(--line)}
.details dt{font-size:13px;font-weight:600;color:var(--muted)}
.details dd{margin:0;font-size:17px;font-weight:700}
.cands{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:13px;font-weight:600;color:var(--muted)}
.cand{width:42px;height:42px;border-radius:14px;background:var(--bg);font-size:20px;font-weight:600;color:var(--text)}
.cand.active{background:var(--tint);color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
h3{margin:20px 0 10px;font-size:16px;font-weight:800;letter-spacing:-.01em}
ul{list-style:none;margin:0 -20px;padding:0 20px 2px;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.match{flex:none;width:140px;padding:14px;border-radius:18px;border:1.5px solid var(--line);display:grid;gap:2px}
.m-lang{font-size:12px;font-weight:700;color:var(--muted);order:1}
.m-lang .m-code{display:none}
.m-char{font-size:36px;font-weight:600;line-height:1.1;order:0;margin-bottom:4px}
.m-read{font-weight:800;font-size:15px;order:2;margin-top:4px}
.m-gloss{font-size:13px;color:var(--muted);order:3}
</style>
</head>
<body>
<div class="phone" data-state="ready" data-lang="CN">
  <header class="top">Character <span>Lens</span></header>

  <nav class="langs" aria-label="Language">
    <button data-lang="CN"><span class="g" lang="zh-Hans">中</span><span class="c">CN</span></button>
    <button data-lang="KO"><span class="g" lang="ko">한</span><span class="c">KO</span></button>
    <button data-lang="AR"><span class="g" lang="ar">ع</span><span class="c">AR</span></button>
    <button data-lang="HI"><span class="g" lang="hi">हि</span><span class="c">HI</span></button>
  </nav>

  <div class="card">
    <div class="pad"><canvas id="canvas" data-width="9" aria-label="Drawing area"></canvas><p class="hint" data-bind="hint"></p></div>
    <div class="cardbar">
      <span id="status" role="status">Ready for input</span>
      <span style="display:flex;gap:8px">
        <button class="round" data-action="undo" aria-label="Undo stroke"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
        <button class="round" data-action="clear" aria-label="Clear canvas"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg></button>
      </span>
    </div>
  </div>

  <button class="cta" data-action="analyze"><span class="spin"></span><span class="label">Analyze</span></button>

  <div class="scrim" data-close></div>
  <section class="sheet" role="dialog" aria-label="Result">
    <div class="grab"></div>
    <div class="hero">
      <div class="big" data-bind="char"></div>
      <div class="info"><span class="tag" data-bind="tag"></span><div class="roman" data-bind="roman"></div></div>
      <button class="speak" data-action="speak" aria-label="Play pronunciation"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg></button>
    </div>
    <dl class="details">
      <div><dt data-bind="romanLabel"></dt><dd data-bind="roman"></dd></div>
      <div><dt>Meaning</dt><dd data-bind="meaning"></dd></div>
    </dl>
    <div class="cands"><span>Not it?</span><span id="cands" style="display:flex;gap:8px"></span></div>
    <h3>Same idea in other languages</h3>
    <ul id="matches"></ul>
  </section>
</div>
<script src="shared/shared.js"></script>
</body>
</html>
