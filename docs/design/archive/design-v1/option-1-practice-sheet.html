<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Character Lens · 1 Practice Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;1,400&family=Noto+Serif+SC:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/base.css">
<style>
:root{
  --bg:#f5f0e6; --sheet:#faf6ee; --text:#1c1a16; --muted:#7a7366; --line:#d9d0bd;
  --ink:#1c1a16; --seal:#b83a26; --page:#e4dfd3; --focus:#b83a26;
  --font:'Instrument Sans',system-ui,sans-serif; --serif:'Newsreader','Noto Serif SC',Georgia,serif;
}
.top{padding:22px 24px 0;display:flex;align-items:baseline;justify-content:space-between}
.brand{font:500 22px/1 var(--serif);letter-spacing:-.01em}
.brand i{color:var(--seal)}
.tabs{display:flex;gap:4px;margin:18px 24px 0;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:10px 0 12px;display:grid;gap:2px;justify-items:center;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs .g{font:500 20px/1 var(--serif)}
.tabs .c{font-size:11px;letter-spacing:.08em;font-weight:600}
.tabs button.active{color:var(--text);border-color:var(--seal)}
.sheetwrap{padding:22px 24px 0}
.pad{aspect-ratio:1;background:#fffdf8;border:2px solid var(--seal);box-shadow:inset 0 0 0 5px #fffdf8,inset 0 0 0 6px color-mix(in srgb,var(--seal) 45%,transparent)}
.pad::before{content:"";position:absolute;inset:6px;pointer-events:none;
  background:
   linear-gradient(to right,transparent calc(50% - .5px),color-mix(in srgb,var(--seal) 35%,transparent) calc(50% - .5px) calc(50% + .5px),transparent calc(50% + .5px)),
   linear-gradient(to bottom,transparent calc(50% - .5px),color-mix(in srgb,var(--seal) 35%,transparent) calc(50% - .5px) calc(50% + .5px),transparent calc(50% + .5px)),
   linear-gradient(to bottom right,transparent calc(50% - .5px),color-mix(in srgb,var(--seal) 20%,transparent) calc(50% - .5px) calc(50% + .5px),transparent calc(50% + .5px)),
   linear-gradient(to bottom left,transparent calc(50% - .5px),color-mix(in srgb,var(--seal) 20%,transparent) calc(50% - .5px) calc(50% + .5px),transparent calc(50% + .5px))}
.pad .hint{font:italic 400 17px var(--serif);color:var(--muted)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px 0;font-size:13px;color:var(--muted)}
.bar #status::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line);margin-right:8px;transition:background .2s}
.phone[data-state=drawing] #status::before{background:var(--text)}
.phone[data-state=analyzing] #status::before{background:var(--seal);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.bar button{font-weight:600;color:var(--text);padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.bar button:disabled{color:var(--muted);opacity:.5;text-decoration:none}
.cta{margin:auto 24px 28px;height:56px;border-radius:6px;background:var(--text);color:#faf6ee;font-weight:600;font-size:16px;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .15s,opacity .15s}
.cta:disabled{background:#cfc7b4;color:#8c8575}
.cta:not(:disabled):active{background:#000}

/* result */
.sheet{border-radius:18px 18px 0 0;padding:10px 24px 28px;box-shadow:0 -10px 40px rgba(60,40,10,.18)}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 18px}
.head{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.tile{position:relative;width:104px;height:104px;background:#fffdf8;border:1.5px solid var(--seal);display:grid;place-items:center}
.tile::before{content:"";position:absolute;inset:0;background:linear-gradient(to right,transparent 49.5%,color-mix(in srgb,var(--seal) 30%,transparent) 49.5% 50.5%,transparent 50.5%),linear-gradient(to bottom,transparent 49.5%,color-mix(in srgb,var(--seal) 30%,transparent) 49.5% 50.5%,transparent 50.5%)}
.big{position:relative;font:500 56px/1 var(--serif);white-space:nowrap}
.tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--seal)}
.roman{font:italic 400 30px/1.1 var(--serif);margin-top:6px}
.speak{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--text);display:grid;place-items:center;transition:background .15s,color .15s}
.speak.speaking,.speak:active{background:var(--text);color:var(--sheet)}
.cands{display:flex;gap:8px;margin:20px 0 0;align-items:center;font-size:12px;color:var(--muted)}
.cand{width:40px;height:40px;border:1px solid var(--line);font:500 20px var(--serif);color:var(--text);background:#fffdf8}
.cand.active{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
dl{margin:20px 0 0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:96px 1fr;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px}
dt{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding-top:3px;font-weight:600}
dd{margin:0}
h3{margin:24px 0 4px;font:500 20px var(--serif)}
.sub{margin:0 0 6px;font-size:13px;color:var(--muted)}
ul{list-style:none;margin:0;padding:0}
.match{display:grid;grid-template-columns:1fr auto auto;grid-template-areas:"lang char read" "lang char gloss";column-gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.m-lang{grid-area:lang;font-size:14px;font-weight:500;display:flex;align-items:center;gap:10px}
.m-code{font-size:10px;letter-spacing:.08em;color:var(--seal);border:1px solid currentColor;padding:2px 5px;border-radius:2px}
.m-char{grid-area:char;font:500 30px/1 var(--serif)}
.m-read{grid-area:read;font:italic 15px var(--serif);text-align:right}
.m-gloss{grid-area:gloss;font-size:12px;color:var(--muted);text-align:right}
.done{margin-top:22px;width:100%;height:50px;border:1.5px solid var(--text);border-radius:6px;font-weight:600}
</style>
</head>
<body>
<div class="phone" data-state="ready">
  <header class="top"><div class="brand">Character <i>Lens</i></div></header>

  <nav class="tabs" aria-label="Language">
    <button data-lang="CN"><span class="g" lang="zh-Hans">中</span><span class="c">CN</span></button>
    <button data-lang="KO"><span class="g" lang="ko">한</span><span class="c">KO</span></button>
    <button data-lang="AR"><span class="g" lang="ar">ع</span><span class="c">AR</span></button>
    <button data-lang="HI"><span class="g" lang="hi">हि</span><span class="c">HI</span></button>
  </nav>

  <div class="sheetwrap">
    <div class="pad"><canvas id="canvas" data-width="8" aria-label="Drawing area"></canvas><p class="hint" data-bind="hint"></p></div>
  </div>

  <div class="bar">
    <span id="status" role="status">Ready for input</span>
    <button data-action="clear">Clear</button>
  </div>

  <button class="cta" data-action="analyze"><span class="spin"></span><span class="label">Analyze</span></button>

  <div class="scrim" data-close></div>
  <section class="sheet" role="dialog" aria-label="Result">
    <div class="grab"></div>
    <div class="head">
      <div class="tile"><div class="big" data-bind="char"></div></div>
      <div><div class="tag" data-bind="tag"></div><div class="roman" data-bind="roman"></div></div>
      <button class="speak" data-action="speak" aria-label="Play pronunciation">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>
      </button>
    </div>
    <div class="cands"><span>Also looks like</span><span id="cands" style="display:flex;gap:8px"></span></div>
    <dl>
      <div class="row"><dt data-bind="romanLabel"></dt><dd data-bind="roman"></dd></div>
      <div class="row"><dt>Meaning</dt><dd data-bind="meaning"></dd></div>
    </dl>
    <h3>Same root, other languages</h3>
    <p class="sub">Characters that share this historical origin.</p>
    <ul id="matches"></ul>
    <button class="done" data-action="close">Done</button>
  </section>
</div>
<script src="shared/shared.js"></script>
</body>
</html>
