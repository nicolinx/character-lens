<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Character Lens · 1 Lexicon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Source+Sans+3:wght@400;500;600&family=Noto+Serif+SC:wght@500;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/base.css">
<style>
/* A printed dictionary: hairline rules, small caps, one ink-blue accent. No cards, no shadows. */
:root{
  --bg:#fbfaf6; --sheet:#fbfaf6; --text:#15171c; --muted:#5d6068; --line:#cfcbbf; --rule:#15171c;
  --ink:#15171c; --blue:#1d3f72; --blue-soft:#e6ecf5; --red:#9a2b22;
  --page:#dcd9cf; --focus:#1d3f72; --sk1:#e9e6db; --sk2:#f6f4ec;
  --serif:'Source Serif 4','Noto Serif SC','Noto Serif JP',Georgia,serif; --font:'Source Sans 3',system-ui,sans-serif;
}
body{font-family:var(--serif)}
:lang(zh-Hans){font-family:'Noto Serif SC',var(--serif)} :lang(ja){font-family:'Noto Serif JP',var(--serif)}
.sc{font:600 11px var(--font);letter-spacing:.12em;text-transform:uppercase}
.top{padding:max(18px,env(safe-area-inset-top)) 22px 10px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--rule)}
.brand{font:700 21px/1 var(--serif);letter-spacing:-.01em}
.top .edition{font:500 11px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.langs{display:flex;gap:22px;margin:0 22px;border-bottom:1px solid var(--line)}
.langs button{height:48px;font:600 14px var(--font);letter-spacing:.04em;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px}
.langs button span{font:500 17px var(--serif)}
.langs button.active{color:var(--text);border-color:var(--blue)}
.model{position:relative;margin:10px 22px 0;display:flex;align-items:center;gap:10px;min-height:32px;font:400 13px var(--font);color:var(--muted)}
.model [data-bind=model]{flex:1}
.phone[data-model-state=ready] .model [data-bind=model]::before{content:"● ";color:#2c7a4b}
.phone[data-model-state=downloading] .model [data-bind=model]::before{content:"● ";color:var(--blue)}
.model [data-act=download]{height:32px;padding:0 12px;border:1px solid var(--blue);color:var(--blue);font:600 13px var(--font);border-radius:2px}
.bar{position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--line)}
.bar .bar-fill{display:block;height:100%;width:0;background:var(--blue)}

.pad{margin:12px 22px 0;aspect-ratio:1;border:1px solid var(--rule);background:#fff;
  background-image:linear-gradient(to right,transparent calc(50% - .5px),#d9d5c8 calc(50% - .5px),#d9d5c8 calc(50% + .5px),transparent calc(50% + .5px)),linear-gradient(to bottom,transparent calc(50% - .5px),#d9d5c8 calc(50% - .5px),#d9d5c8 calc(50% + .5px),transparent calc(50% + .5px))}
.pad::before,.pad::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--blue);pointer-events:none}
.pad::before{left:-1px;top:-1px;border-right:0;border-bottom:0}.pad::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.hint{padding:0 40px}
.hint p{font:italic 400 18px/1.35 var(--serif);color:#80796a}
.hint-lock{background:rgba(251,250,246,.92);font:500 14px var(--font);color:var(--muted)}
.status{margin:10px 22px 0;display:flex;align-items:center;min-height:44px;font:500 13px var(--font);color:var(--muted)}
.phone[data-state=error] .status{color:var(--red)}
.tools{margin-left:auto;display:flex}
.tool{height:44px;padding:0 14px;display:flex;align-items:center;gap:6px;font:600 13px var(--font);color:var(--blue)}
.tool:disabled{color:#b3b0a4}
.cands{margin:0 22px;min-height:62px;display:flex;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#cands{display:flex;width:100%}
.cands-empty{font:italic 400 14px var(--serif);color:#80796a}
.chip{flex:1;height:60px;font:500 28px/1 var(--serif);border-right:1px solid var(--line);position:relative}
.chip:last-child{border-right:0}
.chip[aria-pressed=true]{background:var(--blue-soft);color:var(--blue);box-shadow:inset 0 -3px 0 var(--blue)}
.cta-wrap{margin:auto 22px 14px}
.cta{width:100%;height:52px;background:var(--blue);color:#fff;font:600 15px var(--font);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:2px}
.cta:not(:disabled):active{background:#14305a}
.cta:disabled{opacity:.55}
.phone.shake .cta{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tabbar{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{height:54px;font:600 12px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tabbar button.active{color:var(--blue);box-shadow:inset 0 3px 0 var(--blue)}

.hview{padding:18px 22px 24px}
.hview h2{font:700 30px/1.1 var(--serif);letter-spacing:-.02em}
.hview .sub{font:400 13px var(--font);color:var(--muted);margin:4px 0 10px;padding-bottom:10px;border-bottom:2px solid var(--rule)}
.h-item{width:100%;display:grid;grid-template-columns:54px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;min-height:72px}
.h-char{font:500 38px/1 var(--serif)}
.h-read{display:block;font:600 16px var(--serif)}
.h-def{display:block;font:italic 400 14px var(--serif);color:var(--muted);margin-top:1px}
.h-side{display:grid;gap:3px;justify-items:end}
.h-ago{font:400 12px var(--font);color:var(--muted)}
.empty{padding:40px 0;font:italic 400 15px var(--serif);color:var(--muted)}

/* result = a dictionary entry */
.sheet{border-top:2px solid var(--rule);max-height:94%}
.grab{display:none}
.close{position:absolute;right:8px;top:6px;width:44px;height:44px;display:grid;place-items:center;z-index:2;color:var(--text)}
.sheet-scroll{padding:18px 22px 30px}
.s-head{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:end;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.s-char{font:500 96px/1 var(--serif)}
.s-meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-content:end;padding-bottom:6px;min-width:0}
.s-def{flex-basis:100%;font:italic 400 19px/1.25 var(--serif);margin-top:4px}
.tag{font:600 11px var(--font);letter-spacing:.12em;text-transform:uppercase}
.tag-lang{color:var(--blue)}
.tag-var{color:var(--muted)}
.tag-var::before{content:"· "}
.speak{width:48px;height:48px;border:1px solid var(--rule);border-radius:50%;display:grid;place-items:center;margin-bottom:6px}
.speaking .speak{background:var(--blue);color:#fff;border-color:var(--blue)}
.s-cands{display:flex;align-items:center;gap:4px;margin:0;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.s-cands-l{font:600 11px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.s-cands .chip{flex:none;width:40px;height:44px;font-size:21px;border:1px solid var(--line);border-radius:2px}
.s-cands .chip.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue);box-shadow:none}
.card{padding:16px 0 4px;border-bottom:1px solid var(--line)}
.card:last-of-type{border-bottom:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.card-h h3{font:700 11px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.card-sub{font:italic 400 13px var(--serif);color:var(--muted)}
.badge{font:600 11px var(--font);letter-spacing:.06em}
.verified{color:#2c7a4b;display:inline-flex;gap:5px;align-items:center}
.ai-b{color:var(--red);border:1px solid var(--red);padding:1px 6px;text-transform:uppercase;letter-spacing:.1em;font-size:10px}
.kv div{display:grid;grid-template-columns:84px 1fr;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.kv div:first-child{border-top:0}
.kv dt{font:italic 400 14px var(--serif);color:var(--muted)}
.kv dd{font:600 21px/1.25 var(--serif)}
.xl{display:grid;grid-template-columns:repeat(3,1fr);margin:0 -4px}
.x-item{display:grid;justify-items:start;gap:2px;padding:8px 10px 14px;border-left:1px solid var(--line)}
.x-item:first-child{border-left:0}
.x-item.is-current{background:var(--blue-soft)}
.x-lang{font:600 10.5px var(--font);letter-spacing:.14em;color:var(--muted)}
.x-char{font:500 36px/1.1 var(--serif)}
.x-read{font:400 13px/1.3 var(--serif)}
.ai-block{padding-top:10px}
.ai-block h4{margin:0 0 4px;font:600 11px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.comps li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:baseline;padding:3px 0}
.comp-part{font:500 24px/1.1 var(--serif)}
.comp-role{font:400 15.5px/1.4 var(--serif)}
.mnemonic{font:italic 400 17px/1.45 var(--serif)}
.ex{display:grid;grid-template-columns:auto 1fr;column-gap:12px;padding:6px 0;align-items:baseline}
.ex-word{font:500 20px/1.2 var(--serif);grid-row:span 2}
.ex-read{font:600 14.5px var(--serif)}.ex-mean{font:italic 400 14px var(--serif);color:var(--muted)}
.flag{grid-column:2;justify-self:start;font:600 11px var(--font);color:var(--red)}
.flag::before{content:"† "}
.note{font:400 15px/1.45 var(--serif)}
.ai-body.in{animation:fade .5s}
@keyframes fade{from{opacity:0}}
.ai-skel{display:grid;gap:10px;padding-top:6px}
.ai-foot{margin:12px 0 6px;font:italic 400 13px/1.4 var(--serif);color:var(--muted)}
.s-foot{margin-top:14px;padding-top:10px;border-top:2px solid var(--rule);font:400 12px var(--font);color:var(--muted)}
.toast{background:var(--ink);color:#fff;padding:10px 16px;font:500 13.5px var(--font);border-radius:2px;bottom:80px}
</style>
</head>
<body>
<div class="phone" data-state="ready">
  <header class="top"><div class="brand">Character Lens</div><div class="edition">Han characters</div></header>

  <div class="view" data-view="draw">
    <nav class="langs" aria-label="Input language">
      <button data-lang="CN"><span lang="zh-Hans">中</span>Chinese</button>
      <button data-lang="JP"><span lang="ja">日</span>Japanese</button>
    </nav>
    <div class="model"><span data-bind="model"></span><button data-act="download" hidden>Download</button>
      <div class="bar" data-bar hidden><span class="bar-fill"></span></div></div>

    <div class="pad">
      <canvas id="pad" data-width="8" role="img" aria-label="Drawing area: write one character with your finger"></canvas>
      <div class="hint hint-draw"><p>Write one character with your finger.</p></div>
      <div class="hint hint-lock"><p>Download the model to start.</p></div>
    </div>

    <div class="status"><span data-bind="status" role="status"></span>
      <div class="tools">
        <button class="tool" data-act="undo">Undo</button>
        <button class="tool" data-act="clear">Clear</button>
      </div>
    </div>

    <div class="cands"><div id="cands"></div></div>
    <div class="cta-wrap"><button class="cta" data-act="analyze"><span class="spin"></span><span data-bind="cta">Analyze</span></button></div>
  </div>

  <div class="view hview" data-view="history" hidden>
    <h2>History</h2>
    <p class="sub"><span data-bind="histCount"></span> entries, stored on this device</p>
    <ul id="hist"></ul>
  </div>

  <nav class="tabbar" aria-label="Main">
    <button data-tab="draw">Write</button>
    <button data-tab="history">History</button>
  </nav>

  <div class="scrim" data-close></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-label="Character result">
    <button class="close" data-act="close" aria-label="Close"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="sheet-scroll"><div id="sheetBody"></div></div>
  </section>
</div>
<script src="shared/shared.js"></script>
</body>
</html>
