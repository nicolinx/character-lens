<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Character Lens · 2 Signage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Archivo+Narrow:wght@500;600;700&family=Noto+Sans+SC:wght@500;700&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/base.css">
<style>
/* Wayfinding signage: flat colour bars, square tiles, one strong green. For people reading characters off real signs. */
:root{
  --bg:#f3f4f1; --sheet:#f3f4f1; --text:#0f1a14; --muted:#56605a; --line:#c9cec8; --ink:#0f1a14;
  --green:#00613a; --green-d:#004a2c; --green-soft:#dcebe3; --yellow:#ffc72c;
  --cn:#c8202f; --jp:#1c4fa0; --ko:#00613a;
  --page:#dfe2dd; --focus:#0f1a14; --sk1:#dfe3dd; --sk2:#eef0ec;
  --font:'Archivo','Noto Sans SC','Noto Sans JP',system-ui,sans-serif;
}
:lang(zh-Hans){font-family:'Noto Sans SC',var(--font)} :lang(ja){font-family:'Noto Sans JP',var(--font)}
button:focus-visible,canvas:focus-visible{outline:3px solid var(--yellow);outline-offset:0;box-shadow:0 0 0 5px var(--ink)}
.top{background:var(--green);color:#fff;padding:max(16px,env(safe-area-inset-top)) 18px 14px;display:flex;align-items:center;gap:12px}
.mark{width:34px;height:34px;background:#fff;color:var(--green);display:grid;place-items:center;font:700 20px 'Noto Sans SC',sans-serif;border-radius:3px}
.brand{font:700 20px/1 var(--font);letter-spacing:.01em}
.brand small{display:block;font:500 11.5px var(--font);letter-spacing:.08em;text-transform:uppercase;opacity:.82;margin-top:3px}
.langs{display:grid;grid-template-columns:1fr 1fr;border-bottom:3px solid var(--ink);background:#fff}
.langs button{height:56px;display:flex;align-items:center;justify-content:center;gap:10px;font:700 15px var(--font);color:var(--muted)}
.langs button+button{border-left:1px solid var(--line)}
.langs .sq{width:28px;height:28px;border-radius:3px;display:grid;place-items:center;color:#fff;font:700 13px var(--font);background:#9aa39d}
.langs button[data-lang=CN].active .sq{background:var(--cn)}
.langs button[data-lang=JP].active .sq{background:var(--jp)}
.langs button.active{color:var(--text);background:var(--yellow)}
.model{position:relative;display:flex;align-items:center;gap:10px;padding:10px 18px;min-height:46px;font:500 13px var(--font);color:var(--muted);border-bottom:1px solid var(--line)}
.model [data-bind=model]{flex:1}
.phone[data-model-state=ready] .model{color:var(--green)}
.phone[data-model-state=ready] .model [data-bind=model]::before{content:"";display:inline-block;width:9px;height:9px;background:var(--green);margin-right:8px}
.model [data-act=download]{height:32px;padding:0 14px;background:var(--ink);color:#fff;font:700 13px var(--font);border-radius:3px}
.bar{position:absolute;left:0;right:0;bottom:-1px;height:4px;background:var(--line)}
.bar .bar-fill{display:block;height:100%;width:0;background:var(--green)}

.pad{margin:16px 18px 0;aspect-ratio:1;background:#fff;border:3px solid var(--ink);border-radius:4px;
  background-image:linear-gradient(to right,transparent calc(50% - 1px),#e3e6e1 calc(50% - 1px),#e3e6e1 calc(50% + 1px),transparent calc(50% + 1px)),linear-gradient(to bottom,transparent calc(50% - 1px),#e3e6e1 calc(50% - 1px),#e3e6e1 calc(50% + 1px),transparent calc(50% + 1px))}
.hint{padding:0 36px}
.hint p{font:700 20px/1.2 var(--font);color:#8b948e;text-transform:uppercase;letter-spacing:.02em}
.hint small{display:block;margin-top:6px;font:500 13px var(--font);text-transform:none;letter-spacing:0}
.hint-lock{background:rgba(243,244,241,.94)}
.hint-lock p{color:var(--text)}
.status{margin:10px 18px 0;display:flex;align-items:center;gap:10px;min-height:48px}
.led{flex:1;min-width:0;height:44px;padding:0 12px;display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;font:600 13px var(--font);border-radius:3px}
.led::before{content:"";width:10px;height:10px;background:#7d877f;flex:none}
.phone[data-state=drawing] .led::before{background:var(--yellow)}
.phone[data-state=busy] .led::before{background:var(--yellow);animation:pulse 1s infinite}
.phone[data-state=done] .led::before{background:#4ad18a}
.phone[data-state=error] .led{background:var(--cn)}
.phone[data-state=error] .led::before{background:#fff}
@keyframes pulse{50%{opacity:.25}}
.tools{display:flex;gap:6px}
.tool{width:44px;height:44px;border:2px solid var(--ink);border-radius:3px;background:#fff;display:grid;place-items:center}
.tool:disabled{border-color:var(--line);color:#aeb5b0}
.cands{margin:6px 18px 0;min-height:64px;display:flex;align-items:center}
#cands{display:flex;gap:6px;width:100%}
.cands-empty{font:500 13.5px var(--font);color:var(--muted)}
.chip{flex:1;height:58px;border:2px solid var(--ink);border-radius:3px;background:#fff;font:700 28px/1 var(--font)}
.chip[aria-pressed=true]{background:var(--yellow)}
.cta-wrap{margin:auto 18px 14px}
.cta{width:100%;height:58px;background:var(--green);color:#fff;font:700 17px var(--font);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:3px}
.cta:not(:disabled):active{background:var(--green-d)}
.cta:disabled{opacity:.55}
.phone.shake .cta{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tabbar{display:grid;grid-template-columns:1fr 1fr;background:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{height:56px;color:#b7bfb9;font:700 13px var(--font);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px}
.tabbar button.active{color:var(--ink);background:var(--yellow)}

.hview{padding:0 0 20px}
.hview h2{font:800 28px/1 var(--font);padding:20px 18px 4px;text-transform:uppercase;letter-spacing:-.01em}
.hview .sub{font:500 13px var(--font);color:var(--muted);padding:0 18px 14px;border-bottom:3px solid var(--ink)}
.h-item{width:100%;display:grid;grid-template-columns:60px 1fr auto;gap:14px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);text-align:left;min-height:76px;background:#fff}
.h-char{width:56px;height:56px;background:var(--green);color:#fff;display:grid;place-items:center;font:700 32px/1 var(--font);border-radius:3px}
.h-read{display:block;font:700 16px var(--font)}
.h-def{display:block;font:500 13px var(--font);color:var(--muted);margin-top:2px}
.h-side{display:grid;gap:4px;justify-items:end}
.h-ago{font:500 12px var(--font);color:var(--muted)}
.empty{padding:40px 18px;font:500 15px var(--font);color:var(--muted)}

/* result */
.sheet{max-height:93%;border-top:4px solid var(--yellow)}
.grab{display:none}
.close{position:absolute;right:8px;top:8px;width:44px;height:44px;display:grid;place-items:center;color:#fff;z-index:2}
.sheet-scroll{padding:0 0 28px}
.s-head{background:var(--green);color:#fff;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:20px 18px 18px;position:relative}
.s-char{width:116px;height:116px;background:#fff;color:var(--ink);display:grid;place-items:center;font:700 76px/1 var(--font);border-radius:4px}
.s-meta{display:flex;flex-wrap:wrap;gap:6px;align-content:center;padding-right:30px;min-width:0}
.s-def{flex-basis:100%;font:800 22px/1.1 var(--font);text-transform:uppercase;letter-spacing:-.005em;margin-top:6px}
.tag{font:700 12px var(--font);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:3px}
.tag-lang{background:var(--yellow);color:var(--ink)}
.tag-var{border:1.5px solid #fff;color:#fff}
.speak{position:absolute;right:18px;bottom:16px;width:48px;height:48px;background:var(--yellow);color:var(--ink);display:grid;place-items:center;border-radius:3px}
.speaking .speak{background:#fff}
.s-cands{display:flex;align-items:center;gap:4px;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.s-cands-l{font:700 12px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.s-cands .chip{flex:none;width:40px;height:44px;font-size:21px}
.s-cands .chip.on{background:var(--yellow)}
.card{margin:16px 18px 0;background:#fff;border:2px solid var(--ink);border-radius:3px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;background:var(--ink);color:#fff}
.card-h h3{font:700 13px var(--font);letter-spacing:.1em;text-transform:uppercase}
.card-sub{font:500 12px var(--font);opacity:.8}
.badge{font:700 11px var(--font);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:2px;display:inline-flex;align-items:center;gap:5px}
.verified{background:#4ad18a;color:var(--ink)}
.ai-b{background:var(--yellow);color:var(--ink)}
.kv,.xl,.ai-body,.ai-foot{margin:0}
.kv div{display:grid;grid-template-columns:96px 1fr;padding:11px 12px;border-top:1px solid var(--line);align-items:baseline}
.kv div:first-child{border-top:0}
.kv dt{font:600 12px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kv dd{font:700 20px/1.2 var(--font)}
.xl{display:grid;grid-template-columns:repeat(3,1fr)}
.x-item{display:grid;justify-items:center;gap:4px;padding:12px 4px 12px;border-left:1px solid var(--line);text-align:center}
.x-item:first-child{border-left:0}
.x-item.is-current{background:var(--yellow)}
.x-lang{font:700 11px var(--font);color:#fff;padding:2px 8px;border-radius:2px;background:var(--cn)}
.x-item:nth-child(2) .x-lang{background:var(--jp)}
.x-item:nth-child(3) .x-lang{background:var(--ko)}
.x-char{font:700 36px/1.1 var(--font)}
.x-read{font:600 12px/1.3 var(--font)}
.ai-body{padding:12px}
.ai-block+.ai-block{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.ai-block h4{margin:0 0 6px;font:700 12px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.comps li{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:center;padding:3px 0}
.comp-part{width:38px;height:38px;border:2px solid var(--ink);border-radius:3px;display:grid;place-items:center;font:700 21px/1 var(--font)}
.comp-role{font:500 14.5px/1.4 var(--font)}
.mnemonic{font:500 16px/1.45 var(--font)}
.ex{display:grid;grid-template-columns:auto 1fr;column-gap:12px;padding:6px 0;align-items:center}
.ex-word{font:700 20px/1.2 var(--font);grid-row:span 2}
.ex-read{font:700 14px var(--font)}.ex-mean{font:500 13px var(--font);color:var(--muted)}
.flag{grid-column:2;justify-self:start;margin-top:3px;font:700 11px var(--font);text-transform:uppercase;letter-spacing:.05em;background:var(--yellow);padding:2px 6px;border-radius:2px}
.note{font:500 14.5px/1.45 var(--font)}
.ai-body.in{animation:fade .4s}
@keyframes fade{from{opacity:0}}
.ai-skel{display:grid;gap:10px}
.ai-foot{padding:10px 12px;border-top:1px solid var(--line);font:500 12.5px/1.4 var(--font);color:var(--muted);background:#f3f4f1}
.s-foot{text-align:left;padding:14px 18px 0;font:500 12px var(--font);color:var(--muted)}
.toast{background:var(--ink);color:#fff;padding:11px 16px;font:600 13.5px var(--font);border-radius:3px;bottom:84px;border-left:6px solid var(--yellow)}
</style>
</head>
<body>
<div class="phone" data-state="ready">
  <header class="top"><span class="mark" aria-hidden="true">字</span><div class="brand">Character Lens<small>Handwriting to meaning</small></div></header>

  <div class="view" data-view="draw">
    <nav class="langs" aria-label="Input language">
      <button data-lang="CN"><span class="sq">CN</span>Chinese</button>
      <button data-lang="JP"><span class="sq">JP</span>Japanese</button>
    </nav>
    <div class="model"><span data-bind="model"></span><button data-act="download" hidden>Download</button>
      <div class="bar" data-bar hidden><span class="bar-fill"></span></div></div>

    <div class="pad">
      <canvas id="pad" data-width="10" role="img" aria-label="Drawing area: write one character with your finger"></canvas>
      <div class="hint hint-draw"><div><p>Write a character<small>Recognised on this device. Nothing is uploaded.</small></p></div></div>
      <div class="hint hint-lock"><p>Download model first</p></div>
    </div>

    <div class="status">
      <div class="led"><span data-bind="status" role="status"></span></div>
      <div class="tools">
        <button class="tool" data-act="undo" aria-label="Undo last stroke"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
        <button class="tool" data-act="clear" aria-label="Clear canvas"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg></button>
      </div>
    </div>

    <div class="cands"><div id="cands"></div></div>
    <div class="cta-wrap"><button class="cta" data-act="analyze"><span class="spin"></span><span data-bind="cta">Analyze</span></button></div>
  </div>

  <div class="view hview" data-view="history" hidden>
    <h2>History</h2>
    <p class="sub"><span data-bind="histCount"></span> characters saved on this device</p>
    <ul id="hist"></ul>
  </div>

  <nav class="tabbar" aria-label="Main">
    <button data-tab="draw">Write</button>
    <button data-tab="history">History</button>
  </nav>

  <div class="scrim" data-close></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-label="Character result">
    <button class="close" data-act="close" aria-label="Close"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="sheet-scroll"><div id="sheetBody"></div></div>
  </section>
</div>
<script src="shared/shared.js"></script>
</body>
</html>
