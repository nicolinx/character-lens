<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Character Lens · 5 Canvas First</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/base.css">
<style>
:root{--bg:#fff;--sheet:#fff;--text:#111413;--muted:#757b79;--line:#e8eae9;--teal:#0b7a75;--teal-d:#085c58;--ink:#111413;--focus:#0b7a75;--page:#e5e8e7;--font:'Manrope',system-ui,sans-serif}
/* the drawing surface IS the screen */
.pad{position:absolute;inset:0;
  background-image:linear-gradient(to right,#eef0ef 1px,transparent 1px),linear-gradient(to bottom,#eef0ef 1px,transparent 1px);background-size:48px 48px;background-position:center}
.pad::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:#e1e5e4}
.pad::after{content:"";position:absolute;top:50%;left:0;right:0;height:1px;background:#e1e5e4}
.pad .hint{z-index:1;font-size:15px;color:var(--muted);font-weight:500;padding:0 60px;margin-top:-10px}
.pad canvas{z-index:2}
.float{position:absolute;z-index:5;pointer-events:none}
.float>*{pointer-events:auto}
.topbar{top:0;left:0;right:0;padding:18px 16px 0;display:flex;justify-content:space-between;align-items:center}
.pill{height:44px;padding:0 14px 0 16px;border-radius:22px;background:#fff;box-shadow:0 0 0 1px var(--line),0 4px 14px rgba(0,0,0,.07);display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.pill .g{font-size:18px}
.pill .cd{font-size:12px;font-weight:700;color:var(--teal);letter-spacing:.04em}
.statusb{font-size:13px;font-weight:600;color:var(--muted);background:rgba(255,255,255,.9);padding:8px 12px;border-radius:16px;box-shadow:0 0 0 1px var(--line)}
.phone[data-state=analyzing] .statusb{color:var(--teal)}
.menu{position:absolute;z-index:6;top:70px;left:16px;width:230px;background:#fff;border-radius:16px;padding:6px;box-shadow:0 0 0 1px var(--line),0 16px 40px rgba(0,0,0,.16);transform-origin:top left;transform:scale(.94);opacity:0;pointer-events:none;transition:all .16s}
.phone.menu-open .menu{transform:none;opacity:1;pointer-events:auto}
.menu button{display:flex;align-items:center;gap:12px;width:100%;height:50px;padding:0 12px;border-radius:10px;font-weight:600;font-size:15px;text-align:left}
.menu button .g{width:28px;font-size:20px;text-align:center}
.menu button small{margin-left:auto;font-weight:600;font-size:12px;color:var(--muted)}
.menu button.active{background:#e6f3f2;color:var(--teal-d)}
.dockb{left:0;right:0;bottom:0;padding:0 16px 24px;display:flex;gap:10px;align-items:center;justify-content:center}
.tool{width:56px;height:56px;border-radius:28px;background:#fff;box-shadow:0 0 0 1px var(--line),0 4px 14px rgba(0,0,0,.08);display:grid;place-items:center}
.tool:disabled{opacity:.45}
.cta{flex:1;max-width:210px;height:56px;border-radius:28px;background:var(--text);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.cta:disabled{background:#c5cac8;box-shadow:none}
.cta:not(:disabled):active{background:#000}
.phone.open .float,.phone.open .menu{filter:none}

/* result: compact, leaves the drawing visible above */
.scrim{background:rgba(255,255,255,.35);z-index:7}
.sheet{z-index:8;border-radius:24px 24px 0 0;padding:8px 20px 22px;box-shadow:0 0 0 1px var(--line),0 -16px 50px rgba(0,0,0,.14)}
.grab{width:36px;height:4px;border-radius:2px;background:#d9dddb;margin:0 auto 12px}
.cands{display:flex;gap:8px;align-items:center}
.cands>span:first-child{font-size:12px;font-weight:700;color:var(--muted);margin-right:4px;text-transform:uppercase;letter-spacing:.06em}
.cand{height:44px;min-width:52px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);font-size:22px;font-weight:600}
.cand.active{border-color:var(--teal);background:#e6f3f2;color:var(--teal-d)}
.main{display:flex;align-items:center;gap:16px;margin-top:16px}
.big{font-size:76px;font-weight:600;line-height:1.05;white-space:nowrap}
.mi{flex:1;min-width:0}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.roman{font-size:26px;font-weight:700;letter-spacing:-.01em;margin-top:2px}
.meaning{font-size:16px;color:var(--text);margin-top:2px}
.rl{font-size:12px;color:var(--muted);font-weight:600;margin-top:6px}
.speak{width:56px;height:56px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;flex:none;transition:background .15s}
.speak.speaking{background:var(--teal-d)}
h3{margin:20px 0 8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.match{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;border-radius:14px;background:#f3f5f4}
.m-char{font-size:26px;font-weight:600;line-height:1}
.m-lang{font-size:0}
.m-lang .m-code{font-size:11px;font-weight:700;color:var(--teal);letter-spacing:.04em}
.m-read{font-weight:700;font-size:14px}
.m-gloss{display:none}
</style>
</head>
<body>
<div class="phone" data-state="ready" id="app">
  <div class="pad"><canvas id="canvas" data-width="9" aria-label="Drawing area"></canvas><p class="hint" data-bind="hint"></p></div>

  <div class="float topbar">
    <button class="pill" id="langBtn" aria-haspopup="true" aria-expanded="false">
      <span class="g" data-bind="langGlyph"></span><span data-bind="langName"></span><span class="cd" data-bind="langCode"></span>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <span class="statusb" id="status" role="status">Ready for input</span>
  </div>

  <div class="menu" id="menu" role="menu">
    <button data-lang="CN"><span class="g" lang="zh-Hans">中</span>Chinese<small>Hanzi</small></button>
    <button data-lang="KO"><span class="g" lang="ko">한</span>Korean<small>Hanja</small></button>
    <button data-lang="AR"><span class="g" lang="ar">ع</span>Arabic<small>العربية</small></button>
    <button data-lang="HI"><span class="g" lang="hi">हि</span>Hindi<small>देवनागरी</small></button>
  </div>

  <div class="float dockb">
    <button class="tool" data-action="undo" aria-label="Undo stroke"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="cta" data-action="analyze"><span class="spin"></span><span class="label">Analyze</span></button>
    <button class="tool" data-action="clear" aria-label="Clear canvas"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg></button>
  </div>

  <div class="scrim" data-close></div>
  <section class="sheet" role="dialog" aria-label="Result">
    <div class="grab"></div>
    <div class="cands"><span>Matches</span><span id="cands" style="display:flex;gap:8px"></span></div>
    <div class="main">
      <div class="big" data-bind="char"></div>
      <div class="mi">
        <div class="tag" data-bind="tag"></div>
        <div class="roman" data-bind="roman"></div>
        <div class="meaning" data-bind="meaning"></div>
        <div class="rl"><span data-bind="romanLabel"></span></div>
      </div>
      <button class="speak" data-action="speak" aria-label="Play pronunciation"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg></button>
    </div>
    <h3>Cross-language matches</h3>
    <ul id="matches"></ul>
  </section>
</div>
<script src="shared/shared.js"></script>
<script>
  // language popover: option-specific behaviour
  const app = document.getElementById('app'), btn = document.getElementById('langBtn');
  const set = o => { app.classList.toggle('menu-open', o); btn.setAttribute('aria-expanded', o); };
  btn.addEventListener('click', e => { e.stopPropagation(); set(!app.classList.contains('menu-open')); });
  document.addEventListener('click', e => { if (!e.target.closest('#menu') || e.target.closest('[data-lang]')) set(false); });
</script>
</body>
</html>
