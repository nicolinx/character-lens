<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Character Lens · 2 Swiss Utility</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/base.css">
<style>
:root{
  --bg:#fff; --sheet:#fff; --text:#0d0d0f; --muted:#6b6e76; --line:#e4e5e8; --soft:#f4f5f7;
  --ink:#0d0d0f; --blue:#1f4fff; --focus:#1f4fff; --page:#e6e7ea;
  --font:'Schibsted Grotesk',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
.top{padding:20px 20px 0;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand::before{content:"";width:14px;height:14px;border:2.5px solid var(--blue);border-radius:50%}
.seg{display:grid;grid-template-columns:repeat(4,1fr);margin:18px 20px 0;background:var(--soft);padding:3px;border-radius:10px}
.seg button{height:38px;border-radius:8px;font:500 13px var(--mono);color:var(--muted);transition:all .15s}
.seg button.active{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 1px rgba(0,0,0,.04)}
.lbl{margin:18px 20px 8px;display:flex;justify-content:space-between;align-items:baseline}
.lbl b{font-size:15px;font-weight:600}
.lbl span{font:400 12px var(--mono);color:var(--muted)}
.pad{margin:0 20px;aspect-ratio:1;border:1.5px solid var(--text);border-radius:4px;
  background:
   linear-gradient(var(--line),var(--line)) 33.333% 0/1px 100% no-repeat,
   linear-gradient(var(--line),var(--line)) 66.666% 0/1px 100% no-repeat,
   linear-gradient(var(--line),var(--line)) 0 33.333%/100% 1px no-repeat,
   linear-gradient(var(--line),var(--line)) 0 66.666%/100% 1px no-repeat}
.pad .hint{font-size:14px;color:var(--muted);padding:0 40px}
.pad .corner{position:absolute;top:8px;right:10px;font:400 11px var(--mono);color:var(--muted);pointer-events:none}
.statusrow{margin:12px 20px 0;display:flex;align-items:center;gap:8px;font:400 12px var(--mono);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:#c9cbd1}
.phone[data-state=drawing] .dot{background:var(--text)}
.phone[data-state=analyzing] .dot{background:var(--blue);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.actions{margin:auto 20px 24px;display:grid;grid-template-columns:56px 1fr;gap:10px}
.icon{height:56px;border:1.5px solid var(--text);border-radius:10px;display:grid;place-items:center}
.icon:disabled{border-color:var(--line);color:#b5b8be}
.cta{height:56px;border-radius:10px;background:var(--blue);color:#fff;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.cta:disabled{background:#c7d2ff}
.cta:not(:disabled):active{background:#1740d6}

.sheet{border-radius:16px 16px 0 0;padding:8px 20px 24px;box-shadow:0 -1px 0 var(--line),0 -20px 50px rgba(0,0,0,.14)}
.grab{width:32px;height:4px;border-radius:2px;background:#d3d5da;margin:0 auto 14px}
.hdr{display:flex;justify-content:space-between;align-items:center}
.tag{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
.x{width:32px;height:32px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.hero{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 0 4px}
.big{font:500 92px/1.05 var(--font);letter-spacing:-.02em}
.speak{width:56px;height:56px;border-radius:50%;background:var(--text);color:#fff;display:grid;place-items:center;margin-bottom:10px;transition:background .15s}
.speak.speaking{background:var(--blue)}
.cands{display:flex;gap:6px;align-items:center;margin:2px 0 14px;font:400 12px var(--mono);color:var(--muted)}
.cand{min-width:38px;height:32px;padding:0 8px;border-radius:6px;background:var(--soft);font:500 17px var(--font);color:var(--text)}
.cand.active{background:var(--text);color:#fff}
.kv{border-top:1.5px solid var(--text)}
.kv div{display:grid;grid-template-columns:110px 1fr;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.kv dt{font:400 12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kv dd{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
h3{margin:22px 0 8px;font-size:13px;font-weight:600;display:flex;justify-content:space-between}
h3 span{font:400 12px var(--mono);color:var(--muted)}
ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"char lang" "char read" "char gloss";column-gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px}
.m-char{grid-area:char;font:500 32px/1 var(--font);align-self:center}
.m-lang{grid-area:lang;font:500 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.m-lang .m-code{display:none}
.m-read{grid-area:read;font-weight:600;font-size:14px;margin-top:2px}
.m-gloss{grid-area:gloss;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="phone" data-state="ready">
  <header class="top"><div class="brand">Character Lens</div></header>

  <nav class="seg" aria-label="Language">
    <button data-lang="AR">AR</button><button data-lang="CN">CN</button><button data-lang="KO">KO</button><button data-lang="HI">HI</button>
  </nav>

  <div class="lbl"><b data-bind="langName"></b><span data-bind="hint"></span></div>

  <div class="pad"><canvas id="canvas" data-width="8" aria-label="Drawing area"></canvas></div>

  <div class="statusrow"><span class="dot"></span><span id="status" role="status">Ready for input</span></div>

  <div class="actions">
    <button class="icon" data-action="clear" aria-label="Clear canvas">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>
    </button>
    <button class="cta" data-action="analyze"><span class="spin"></span><span class="label">Analyze</span></button>
  </div>

  <div class="scrim" data-close></div>
  <section class="sheet" role="dialog" aria-label="Result">
    <div class="grab"></div>
    <div class="hdr"><span class="tag" data-bind="tag"></span>
      <button class="x" data-action="close" aria-label="Close"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="hero">
      <div class="big" data-bind="char"></div>
      <button class="speak" data-action="speak" aria-label="Play pronunciation"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg></button>
    </div>
    <div class="cands"><span>Other matches</span><span id="cands" style="display:flex;gap:6px"></span></div>
    <dl class="kv">
      <div><dt data-bind="romanLabel"></dt><dd data-bind="roman"></dd></div>
      <div><dt>Meaning</dt><dd data-bind="meaning"></dd></div>
    </dl>
    <h3>Cross-language matches <span>same root</span></h3>
    <ul id="matches"></ul>
  </section>
</div>
<script src="shared/shared.js"></script>
</body>
</html>
