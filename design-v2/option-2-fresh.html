<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Character Lens · 2 Fresh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/base.css">
<style>
:root{
  --bg:#f4f5fc; --sheet:#f4f5fc; --card:#fff; --text:#14152b; --muted:#6a6d86; --line:#e6e8f4;
  --ink:#1b1c3a; --brand:#5b4df5; --brand-d:#4437d6; --brand-soft:#ecebff; --pink:#ff6b9d; --teal:#12a78a; --teal-soft:#dff5ef;
  --page:#dfe1ee; --focus:#5b4df5; --sk1:#e7e8f6; --sk2:#f4f5fc;
  --font:'Plus Jakarta Sans','Noto Sans SC','Noto Sans JP',system-ui,sans-serif;
}
:lang(zh-Hans){font-family:'Noto Sans SC',var(--font)} :lang(ja){font-family:'Noto Sans JP',var(--font)}
.phone{background:radial-gradient(120% 50% at 80% -10%,#e2defe 0,transparent 60%),var(--bg)}
.top{padding:max(24px,env(safe-area-inset-top)) 22px 0}
.hello{font-size:13px;font-weight:600;color:var(--brand);letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--brand),#8b6cff);display:grid;place-items:center;color:#fff;font:700 15px/1 'Noto Sans SC',sans-serif}
h1{font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.025em;margin-top:10px}
.seg{margin:16px 22px 0;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:16px;background:#e8e9f6}
.seg button{height:44px;border-radius:12px;font-weight:600;font-size:14.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s}
.seg button b{font:700 16px 'Noto Sans SC',sans-serif}
.seg button.active{background:#fff;color:var(--text);box-shadow:0 2px 8px rgba(40,30,120,.12)}
.model{margin:10px 22px 0;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--muted);min-height:32px;position:relative}
.model [data-bind=model]{flex:1}
.model::before{content:"";width:8px;height:8px;border-radius:50%;background:#b9bbd0;flex:none}
.phone[data-model-state=ready] .model::before{background:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.phone[data-model-state=downloading] .model::before{background:var(--brand);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.model [data-act=download]{height:32px;padding:0 14px;border-radius:16px;background:var(--brand);color:#fff;font-weight:700;font-size:12.5px}
.bar{position:absolute;left:0;right:0;bottom:-3px;height:4px;background:#dcdcf3;border-radius:2px;overflow:hidden}
.bar .bar-fill{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),#8b6cff)}

.pad{margin:8px 22px 0;aspect-ratio:1;background:#fff;border-radius:28px;box-shadow:0 1px 0 #fff inset,0 18px 40px -18px rgba(60,50,170,.35),0 0 0 1px var(--line);
  background-image:radial-gradient(circle,#d7d9ee 1.2px,transparent 1.4px);background-size:26px 26px;background-position:13px 13px}
.pad canvas{border-radius:28px}
.hint{padding:0 34px}
.hint .ic{width:56px;height:56px;border-radius:18px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 12px}
.hint .big{font-weight:700;font-size:17px}
.hint small{display:block;margin-top:4px;font-size:13px;color:var(--muted)}
.hint-lock{background:rgba(255,255,255,.88);border-radius:28px;font-weight:600;font-size:14px;color:var(--muted)}
.status{margin:12px 22px 0;display:flex;align-items:center;gap:10px;min-height:40px}
.pill{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:17px;background:#fff;box-shadow:0 0 0 1px var(--line);font-size:12.5px;font-weight:600;color:var(--muted);max-width:100%}
.pill i{width:8px;height:8px;border-radius:50%;background:#c3c5da;flex:none}
.phone[data-state=drawing] .pill i{background:var(--brand)}
.phone[data-state=busy] .pill i{background:var(--pink);animation:pulse 1s infinite}
.phone[data-state=done] .pill i{background:var(--teal)}
.phone[data-state=error] .pill{background:#fff0f4;color:#c0305c;box-shadow:0 0 0 1px #ffc9d8}
.phone[data-state=error] .pill i{background:#e0457a}
.tools{margin-left:auto;display:flex;gap:8px}
.tool{width:44px;height:44px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px var(--line);display:grid;place-items:center;color:var(--text)}
.tool:disabled{color:#c2c4d8;background:transparent;box-shadow:none}
.cands{margin:4px 22px 0;min-height:64px;display:flex;align-items:center}
#cands{display:flex;gap:8px;width:100%}
.cands-empty{font-size:13px;color:#8d90aa}
.chip{flex:1;max-width:64px;height:56px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px var(--line);font:600 26px/1 var(--font);transition:all .15s}
.chip[aria-pressed=true]{background:var(--brand);color:#fff;box-shadow:0 8px 18px -6px rgba(91,77,245,.6);transform:translateY(-2px)}
.cta-wrap{margin:auto 22px 90px}
.cta{width:100%;height:56px;border-radius:28px;background:linear-gradient(135deg,var(--brand),#7d5cff);color:#fff;font:700 16px var(--font);display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 12px 24px -10px rgba(91,77,245,.7);transition:transform .1s}
.cta:not(:disabled):active{transform:scale(.98)}
.cta:disabled{opacity:.65}
.phone.shake .cta{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.tabbar{position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:10;display:flex;gap:4px;padding:5px;border-radius:26px;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);box-shadow:0 10px 30px -8px rgba(40,30,120,.35),0 0 0 1px var(--line)}
.tabbar button{height:46px;padding:0 22px;border-radius:21px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--muted);transition:all .2s}
.tabbar button.active{background:var(--brand);color:#fff}

.hview{padding:6px 22px 100px}
.hview .sub{font-size:13px;color:var(--muted);margin:6px 0 16px}
#hist{display:grid;gap:10px}
.h-item{width:100%;display:grid;grid-template-columns:60px 1fr auto;gap:14px;align-items:center;padding:12px;background:#fff;border-radius:20px;box-shadow:0 0 0 1px var(--line);text-align:left;min-height:76px}
.h-char{width:60px;height:60px;border-radius:16px;background:var(--brand-soft);display:grid;place-items:center;font:600 32px/1 var(--font)}
.h-read{display:block;font-weight:700;font-size:15px}
.h-def{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.h-side{display:grid;gap:5px;justify-items:end}
.h-ago{font-size:11.5px;color:var(--muted)}
.empty{padding:40px 10px;color:var(--muted);text-align:center;font-size:14px}

/* sheet */
.sheet{border-radius:30px 30px 0 0;max-height:94%;box-shadow:0 -20px 60px rgba(30,20,100,.25)}
.sheet::before{content:"";position:absolute;left:0;right:0;top:0;height:230px;background:linear-gradient(180deg,#dcd8ff,rgba(244,245,252,0));border-radius:30px 30px 0 0;pointer-events:none}
.grab{position:relative;width:40px;height:5px;border-radius:3px;background:rgba(40,30,120,.2);margin:10px auto 0}
.close{position:absolute;right:14px;top:16px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.8);display:grid;place-items:center;color:var(--text);z-index:2}
.sheet-scroll{position:relative;padding:12px 18px 30px}
.s-head{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;position:relative}
.s-char{width:128px;height:128px;border-radius:32px;background:#fff;display:grid;place-items:center;font:500 84px/1 var(--font);box-shadow:0 16px 32px -14px rgba(60,50,170,.45)}
.s-meta{display:flex;flex-wrap:wrap;gap:6px;align-content:center;padding-right:44px}
.s-def{flex-basis:100%;font-weight:700;font-size:18px;line-height:1.25;margin-top:4px;letter-spacing:-.01em}
.tag{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:12px}
.tag-lang{background:var(--brand);color:#fff}
.tag-var{background:#fff;color:var(--muted);box-shadow:0 0 0 1px var(--line);font-weight:600}
.speak{position:absolute;right:0;bottom:-2px;width:52px;height:52px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 10px 20px -8px rgba(20,20,60,.6)}
.speaking .speak{background:var(--brand)}
.s-cands{display:flex;align-items:center;gap:8px;margin:16px 0 0;flex-wrap:wrap}
.s-cands-l{font-size:12.5px;font-weight:600;color:var(--muted)}
.s-cands .chip{flex:none;width:44px;height:44px;border-radius:14px;font-size:20px}
.s-cands .chip.on{background:var(--ink);color:#fff;box-shadow:none;transform:none}
.card{background:#fff;border-radius:24px;padding:18px;margin-top:14px;box-shadow:0 0 0 1px var(--line)}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-h h3{font-size:16px;font-weight:800;letter-spacing:-.01em}
.card-sub{font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:12px}
.verified{background:var(--teal-soft);color:#0b7c66}
.ai-b{background:linear-gradient(135deg,#ece9ff,#ffe8f1);color:#7a3fd1}
.kv{display:grid;gap:8px}
.kv div{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--bg);border-radius:14px;gap:12px}
.kv dt{font-size:12.5px;font-weight:600;color:var(--muted)}
.kv dd{font-weight:700;font-size:17px;text-align:right}
.card.ai{background:linear-gradient(180deg,#fff,#faf9ff)}
.xl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.x-item{display:grid;justify-items:center;gap:3px;padding:12px 4px;border-radius:16px;background:var(--bg);text-align:center}
.x-item.is-current{background:var(--brand-soft);box-shadow:0 0 0 2px var(--brand) inset}
.x-lang{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.x-char{font:500 34px/1.1 var(--font)}
.x-read{font-size:12px;font-weight:600;line-height:1.3}
.ai-block+.ai-block{margin-top:16px}
.ai-block h4{margin:0 0 8px;font-size:12px;font-weight:700;color:var(--brand);letter-spacing:.04em;text-transform:uppercase}
.comps{display:grid;gap:8px}
.comps li{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center}
.comp-part{width:44px;height:44px;border-radius:12px;background:var(--brand-soft);display:grid;place-items:center;font:500 24px/1 var(--font)}
.comp-role{font-size:14px;line-height:1.4}
.mnemonic{font-size:15.5px;line-height:1.5;font-weight:500;padding:12px 14px;background:var(--brand-soft);border-radius:14px}
.exs{display:grid;gap:8px}
.ex{display:grid;grid-template-columns:auto 1fr;column-gap:12px;padding:10px 12px;background:var(--bg);border-radius:14px;align-items:center}
.ex-word{font:600 20px/1.2 var(--font);grid-row:span 2}
.ex-read{font-weight:700;font-size:13.5px}.ex-mean{font-size:12.5px;color:var(--muted)}
.flag{grid-column:1/-1;justify-self:start;margin-top:6px;font-size:11px;font-weight:700;color:#8a5a00;background:#fff1cf;padding:3px 8px;border-radius:10px}
.note{font-size:14px;line-height:1.45}
.ai-body.in{animation:fade .5s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.ai-skel{display:grid;gap:10px}
.ai-foot{margin-top:16px;font-size:12px;line-height:1.45;color:var(--muted)}
.s-foot{text-align:center;font-size:11.5px;color:var(--muted);margin-top:16px}
.toast{background:var(--ink);color:#fff;padding:11px 18px;border-radius:20px;font-size:13.5px;font-weight:600;bottom:96px}
</style>
</head>
<body>
<div class="phone" data-state="ready">
  <div class="view" data-view="draw">
    <header class="top">
      <div class="hello"><span class="logo" aria-hidden="true">字</span>Character Lens</div>
      <h1>Draw it. Understand it.</h1>
    </header>

    <nav class="seg" aria-label="Input language">
      <button data-lang="CN" lang="zh-Hans"><b>中</b>Chinese</button>
      <button data-lang="JP" lang="ja"><b lang="ja" style="font-family:'Noto Sans JP'">日</b>Japanese</button>
    </nav>
    <div class="model"><span data-bind="model"></span><button data-act="download" hidden>Download</button>
      <div class="bar" data-bar hidden><span class="bar-fill"></span></div></div>

    <div class="pad">
      <canvas id="pad" data-width="9" role="img" aria-label="Drawing area: write one character with your finger"></canvas>
      <div class="hint hint-draw"><div>
        <div class="ic"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14 7l3 3"/></svg></div>
        <p class="big">Write a character here</p><small>Recognised on your device, never uploaded</small></div></div>
      <div class="hint hint-lock"><p>Download the model to start</p></div>
    </div>

    <div class="status">
      <span class="pill"><i></i><span data-bind="status" role="status"></span></span>
      <div class="tools">
        <button class="tool" data-act="undo" aria-label="Undo last stroke"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
        <button class="tool" data-act="clear" aria-label="Clear canvas"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg></button>
      </div>
    </div>

    <div class="cands"><div id="cands"></div></div>
    <div class="cta-wrap"><button class="cta" data-act="analyze"><span class="spin"></span><span data-bind="cta">Analyze</span></button></div>
  </div>

  <div class="view hview" data-view="history" hidden>
    <header class="top" style="padding-left:0;padding-right:0"><div class="hello"><span class="logo" aria-hidden="true">字</span>Character Lens</div><h1>History</h1></header>
    <p class="sub"><span data-bind="histCount"></span> characters · saved on this device</p>
    <ul id="hist"></ul>
  </div>

  <nav class="tabbar" aria-label="Main">
    <button data-tab="draw"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14 7l3 3"/></svg>Draw</button>
    <button data-tab="history"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>History</button>
  </nav>

  <div class="scrim" data-close></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-label="Character result">
    <div class="grab"></div>
    <button class="close" data-act="close" aria-label="Close"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="sheet-scroll"><div id="sheetBody"></div></div>
  </section>
</div>
<script src="shared/shared.js"></script>
</body>
</html>
